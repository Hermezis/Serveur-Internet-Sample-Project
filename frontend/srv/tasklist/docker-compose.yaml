version: '3.8'

services:
  database:
    image: hermezis/database
    container_name: inspiring_hofstadter
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - ./db-data:/var/lib/mysql
    networks:
      - proxy

  frontend:
    image: hermezis/frontend
    container_name: nifty_moser
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tasklist.rule=Host(`${TASKLIST_DOMAIN}`)"
      - "traefik.http.routers.tasklist.entrypoints=websecure"
      - "traefik.http.routers.tasklist.tls=true"
      - "traefik.http.services.tasklist.loadbalancer.server.port=${TASKLIST_PORT}"
      - "traefik.http.routers.tasklist.middlewares=${TASKLIST_MIDDLEWARE}"

  backend:
    image: hermezis/backendweb
    container_name: stoic_jang
    environment:
      DB_HOST: ${DB_CONTAINER}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${BACKEND_PORT}
      HOST: ${BACKEND_HOST}
    networks:
      - proxy
    depends_on:
      - database
    labels:
      - "traefik.enable=true"
      # Router backend
      - "traefik.http.routers.backend.rule=Host(`${TASKLIST_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      # Service backend
      - "traefik.http.services.backend.loadbalancer.server.port=${BACKEND_PORT}"

networks:
  proxy:
    external: true