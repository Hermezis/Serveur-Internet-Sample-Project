services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    # restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    
    command:
       - "--providers.docker=true"
       - "--providers.docker.exposedbydefault=false"
       - "--providers.docker.network=proxy"
       - "--entryPoints.web.address=:80"
       - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
       - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
       - "--entryPoints.websecure.address=:443"
       - "--providers.file.directory=/dynamic"

       - "--log.level=${TRAEFIK_LOG_LEVEL}"
       - "--api.dashboard=true"
       - "--api.insecure=${TRAEFIK_API_INSECURE}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=tinyauth"
    ports:
      - "80:80"
      - "443:443"
    

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/dynamic:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - proxy
  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:v4
    container_name: tinyauth
    restart: unless-stopped
    environment:
      - APP_URL=${TINYAUTH_APP_URL}
      - PROVIDERS_GOOGLE_REDIRECT_URI=${TINYAUTH_GOOGLE_REDIRECT_URI}
      - USERS=${TINYAUTH_USERS}
      - PROVIDERS_GOOGLE_CLIENT_ID=${TINYAUTH_GOOGLE_CLIENT_ID}
      - PROVIDERS_GOOGLE_CLIENT_SECRET=${TINYAUTH_GOOGLE_CLIENT_SECRET}
      - OAUTH_WHITELIST=${TINYAUTH_OAUTH_WHITELIST}
    volumes:
      - ./data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tinyauth.rule=Host(`${TINYAUTH_DOMAIN}`)"
      - "traefik.http.routers.tinyauth.entrypoints=websecure"
      - "traefik.http.routers.tinyauth.tls=true"
      - "traefik.http.services.tinyauth.loadbalancer.server.port=${TINYAUTH_PORT}"
      - "traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik"
    networks:
      - proxy
networks:
  proxy:
    external: true




